name: Autosubmit

on:
  pull_request_target:
    types:
      - labeled
      - synchronize
      - opened
      - reopened
      - ready_for_review

jobs:
  autosubmit:
    if: contains(github.event.pull_request.labels.*.name, 'autosubmit')
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
