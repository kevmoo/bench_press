name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform; one red result must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: dev

      - name: Setup Node.js (WasmGC runner)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: dart pub get

      # Formatting and analysis are platform-independent, so they run once.
      # `dart format --set-exit-if-changed` would also be a false alarm on
      # Windows, where git may check files out with CRLF endings.
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        if: matrix.os == 'ubuntu-latest'
        run: dart analyze --fatal-infos

      - name: Run test suite
        run: dart test

      - name: Validate benchmark suite
        run: dart run bin/bench_press.dart validate benchmark/
